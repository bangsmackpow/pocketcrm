name: PocketCRM CI & Cloudflare Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Offline Seed & Build SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npm run typecheck

      - name: Verify Local Offline SQLite Migration & Seeding
        run: npm run db:seed:local

      - name: Build Production SPA Assets (dist/client)
        run: npm run build
